services:
  mysql:
    image: mysql:8.0
    container_name: news-bot-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: Root@123456
      MYSQL_ROOT_HOST: "%"  # 允许所有主机访问
      MYSQL_DATABASE: news_bot_db
      # 强制使用旧认证插件，无需cryptography
      MYSQL_INITDB_ARGS: "--default-authentication-plugin=mysql_native_password"
    volumes:
      - ./scripts/db_init.sql:/docker-entrypoint-initdb.d/db_init.sql
    restart: unless-stopped
volumes:
  mysql_data: